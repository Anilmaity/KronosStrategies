name: kronos

# ─────────────────────────────────────────────────────────────────────────────
# Shared env block — keeps repeated keys DRY.
# Services override or add to these via env_file / environment:.
# ─────────────────────────────────────────────────────────────────────────────
x-common-env: &common-env
  env_file:
    - .env

services:

  # ───────────────────────────────────────────────────────────────────────────
  # Infrastructure
  # Note: both the TimescaleDB tick store (TIGERDATA_URL) and the Django
  # backend database (HOST/PORT/NAME/USER/PASSWORD) live on TigerData Cloud.
  # The local `tsdb` and `db` containers were retired once data was migrated;
  # the stack now points exclusively at TigerData.
  # ───────────────────────────────────────────────────────────────────────────
  # ───────────────────────────────────────────────────────────────────────────
  # Tick Data Collector — polls OANDA S5 candles → writes to TimescaleDB
  # ───────────────────────────────────────────────────────────────────────────
  tick_data_collector:
    build: ./tick_data_collector
    restart: always
    env_file: .env
    environment:
      TSDB_TARGET:   ${TSDB_TARGET:-tigerdata}
      TIGERDATA_URL: ${TIGERDATA_URL:-}

  # ───────────────────────────────────────────────────────────────────────────
  # Position manager — evaluates open positions every second, closes on TP/SL
  # ───────────────────────────────────────────────────────────────────────────
  position_manager:
    build: ./position_manager
    restart: always
    env_file: .env
    environment:
      TSDB_TARGET:   ${TSDB_TARGET:-tigerdata}
      TIGERDATA_URL: ${TIGERDATA_URL:-}

  # Liquidity sweep family. VAR2 backtested best (79.5% WR / PF 5.25); VAR1 and
  # VAR3 backtested <70% WR but are run live per operator decision.
  liquidity_sweep:
    build: ./strategies
    restart: always
    command: python liquidity_sweep.py
    env_file: .env
    environment:
      TSDB_TARGET:   ${TSDB_TARGET:-tigerdata}
      TIGERDATA_URL: ${TIGERDATA_URL:-}

  liquidity_scalper:
    build: ./strategies
    restart: always
    command: python liquidity_scalper.py
    env_file: .env
    environment:
      TSDB_TARGET:   ${TSDB_TARGET:-tigerdata}
      TIGERDATA_URL: ${TIGERDATA_URL:-}
      XAUUSD_SYMBOL: XAU_USD

  micro_scalper:
    build: ./strategies
    restart: always
    command: python micro_scalper.py
    env_file: .env
    environment:
      TSDB_TARGET:   ${TSDB_TARGET:-tigerdata}
      TIGERDATA_URL: ${TIGERDATA_URL:-}
      XAUUSD_SYMBOL: XAU_USD

  # OOS-validated ICT/SMC suite (param-sweep + walk-forward + MC + hold-out).
  # Each variation runs a separate xauusd_runner process and dispatches to its
  # strategy module via the XAUUSD_STRATEGY env var.
  ict_s2_fvg:
    build: ./strategies
    restart: always
    command: python xauusd_runner.py
    env_file: .env
    environment:
      TSDB_TARGET:   ${TSDB_TARGET:-tigerdata}
      TIGERDATA_URL: ${TIGERDATA_URL:-}
      XAUUSD_STRATEGY: S2
      XAUUSD_SYMBOL:   XAU_USD
      XAUUSD_POLL_SEC: "60"

  ict_s4_breaker:
    build: ./strategies
    restart: always
    command: python xauusd_runner.py
    env_file: .env
    environment:
      TSDB_TARGET:   ${TSDB_TARGET:-tigerdata}
      TIGERDATA_URL: ${TIGERDATA_URL:-}
      XAUUSD_STRATEGY: S4
      XAUUSD_SYMBOL:   XAU_USD
      XAUUSD_POLL_SEC: "60"

  ict_s6_daily_crt:
    build: ./strategies
    restart: always
    command: python xauusd_runner.py
    env_file: .env
    environment:
      TSDB_TARGET:   ${TSDB_TARGET:-tigerdata}
      TIGERDATA_URL: ${TIGERDATA_URL:-}
      XAUUSD_STRATEGY: S6
      XAUUSD_SYMBOL:   XAU_USD
      XAUUSD_POLL_SEC: "300"


  # ───────────────────────────────────────────────────────────────────────────
  # Research strategies (backtest_strategies/sNN_*.py). Generic
  # research_runner.py dispatches to each via RESEARCH_STRATEGY env var.
  # These are research-only — not OOS-validated. See backtest results in
  # strategies/backtest/results/ before tuning entry quantities.
  # ───────────────────────────────────────────────────────────────────────────

  research_ob_mit:
    build: ./strategies
    restart: always
    command: python research_runner.py
    env_file: .env
    environment:
      TSDB_TARGET: ${TSDB_TARGET:-tigerdata}
      TIGERDATA_URL: ${TIGERDATA_URL:-}
      RESEARCH_STRATEGY: s03_ob_mitigation

  research_bb:
    build: ./strategies
    restart: always
    command: python research_runner.py
    env_file: .env
    environment:
      TSDB_TARGET: ${TSDB_TARGET:-tigerdata}
      TIGERDATA_URL: ${TIGERDATA_URL:-}
      RESEARCH_STRATEGY: s04_breaker_block

  research_m90_bias:
    build: ./strategies
    restart: always
    command: python research_runner.py
    env_file: .env
    environment:
      TSDB_TARGET: ${TSDB_TARGET:-tigerdata}
      TIGERDATA_URL: ${TIGERDATA_URL:-}
      RESEARCH_STRATEGY: s12_m90_fade_bias

  research_ob_mit_bias:
    build: ./strategies
    restart: always
    command: python research_runner.py
    env_file: .env
    environment:
      TSDB_TARGET: ${TSDB_TARGET:-tigerdata}
      TIGERDATA_URL: ${TIGERDATA_URL:-}
      RESEARCH_STRATEGY: s14_ob_mit_bias

  research_m90_ny_buy:
    build: ./strategies
    restart: always
    command: python research_runner.py
    env_file: .env
    environment:
      TSDB_TARGET: ${TSDB_TARGET:-tigerdata}
      TIGERDATA_URL: ${TIGERDATA_URL:-}
      RESEARCH_STRATEGY: s11_m90_fade_ny
