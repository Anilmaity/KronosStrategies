name: kronos

# ─────────────────────────────────────────────────────────────────────────────
# Shared env block — keeps repeated keys DRY.
# Services override or add to these via env_file / environment:.
# ─────────────────────────────────────────────────────────────────────────────
x-common-env: &common-env
  env_file:
    - .env

services:

  # ───────────────────────────────────────────────────────────────────────────
  # Infrastructure
  # Note: both the TimescaleDB tick store (TIGERDATA_URL) and the Django
  # backend database (HOST/PORT/NAME/USER/PASSWORD) live on TigerData Cloud.
  # The local `tsdb` and `db` containers were retired once data was migrated;
  # the stack now points exclusively at TigerData.
  # ───────────────────────────────────────────────────────────────────────────
  # ───────────────────────────────────────────────────────────────────────────
  # Tick Data Collector — polls OANDA S5 candles → writes to TimescaleDB
  # ───────────────────────────────────────────────────────────────────────────
  tick_data_collector:
    build: ./tick_data_collector
    restart: always
    env_file: .env
    environment:
      TSDB_TARGET:      ${TSDB_TARGET:-tigerdata}
      TIGERDATA_URL:    ${TIGERDATA_URL:-}
      OANDA_INSTRUMENT: XAU_USD

  # Same image, second instance polling XAG_USD (silver). Writes to the same
  # ltp hypertable, distinguished by the `symbol` column.
  tick_data_collector_xagusd:
    build: ./tick_data_collector
    restart: always
    env_file: .env
    environment:
      TSDB_TARGET:      ${TSDB_TARGET:-tigerdata}
      TIGERDATA_URL:    ${TIGERDATA_URL:-}
      OANDA_INSTRUMENT: XAG_USD

  # ───────────────────────────────────────────────────────────────────────────
  # Position manager — evaluates open positions every second, closes on TP/SL
  # ───────────────────────────────────────────────────────────────────────────
  position_manager:
    build: ./position_manager
    restart: always
    env_file: .env
    environment:
      TSDB_TARGET:   ${TSDB_TARGET:-tigerdata}
      TIGERDATA_URL: ${TIGERDATA_URL:-}

  # ───────────────────────────────────────────────────────────────────────────
  # Research strategies (backtest_strategies/sNN_*.py). Generic
  # research_runner.py dispatches to each via RESEARCH_STRATEGY env var.
  # These are research-only — not OOS-validated. See backtest results in
  # strategies/backtest/results/ before tuning entry quantities.
  # ───────────────────────────────────────────────────────────────────────────

  research_m90_bias:
    build: ./strategies
    restart: always
    command: python research_runner.py
    env_file: .env
    environment:
      TSDB_TARGET: ${TSDB_TARGET:-tigerdata}
      TIGERDATA_URL: ${TIGERDATA_URL:-}
      RESEARCH_STRATEGY: s12_m90_fade_bias

  research_ob_mit_bias:
    build: ./strategies
    restart: always
    command: python research_runner.py
    env_file: .env
    environment:
      TSDB_TARGET: ${TSDB_TARGET:-tigerdata}
      TIGERDATA_URL: ${TIGERDATA_URL:-}
      RESEARCH_STRATEGY: s14_ob_mit_bias

  # Concept strategies (concept_strategies/cNN_*.py). C03_FVG_FILL promoted
  # live 2026-05-18 — top performer of 20-concept build (2026-05-17 batch).
  concept_c03_fvg_fill:
    build: ./strategies
    restart: always
    command: python research_runner.py
    env_file: .env
    environment:
      TSDB_TARGET: ${TSDB_TARGET:-tigerdata}
      TIGERDATA_URL: ${TIGERDATA_URL:-}
      RESEARCH_STRATEGY: c03_fvg_fill

  # ───────────────────────────────────────────────────────────────────────────
  # Combined Suite v2 — the WHOLE two-sided XAU/USD book as ONE strategy.
  #   MR base (S02/S05/S06/S07/S14, reused legs) + long fades (E1/E2/E3) +
  #   bear-day short fades (SE1/SE2); BOS daily-bias gate; per-leg ATR exits +
  #   max-holds (via the new Signal.max_hold_min -> TIME_EXIT trigger); holds
  #   several legs open at once (CONFIG.max_concurrent_positions=12).
  #   The MR legs (S02/S05/S06/S07/S14) are now traded ONLY via this combined
  #   strategy — the standalone kronos_s02/s05/s06/s07/s14 services were removed
  #   2026-05-25 (their DB strategies were deleted) to avoid double-firing.
  # NOTE the enlarged windows/fetch-depth: the MR legs need 205 M15/M5 bars, so
  #   the default WIN_15M=100 would keep them silent.
  # SAFETY: set DRY_RUN: "true" here to smoke-test (logs orders, places NONE).
  # ───────────────────────────────────────────────────────────────────────────
  kronos_combined_v2:
    build: ./strategies
    restart: always
    command: python research_runner.py
    env_file: .env
    environment:
      TSDB_TARGET: ${TSDB_TARGET:-tigerdata}
      TIGERDATA_URL: ${TIGERDATA_URL:-}
      RESEARCH_STRATEGY: kronos_combined_v2
      RESEARCH_WIN_15M: "260"
      RESEARCH_WIN_5M:  "260"
      RESEARCH_DAYS_15M: "7"
      RESEARCH_DAYS_5M:  "4"
      # DRY_RUN: "true"   # uncomment to smoke-test without placing real orders

  # ───────────────────────────────────────────────────────────────────────────
  # Telegram copy-trader — mirrors @NeymarGoldTrader signals onto the live
  # MetaAPI account. Telethon listens to the channel, parse_signals turns each
  # post into entry-zone / SL / 3 TPs, and one order per TP is submitted (see
  # Telegram_Bot/). Signals + per-TP orders + lifecycle events persist to
  # TigerData (tg_signals / tg_orders / tg_signal_updates — auto-created on boot
  # by db.init_schema(), so no separate DB-deploy step is needed).
  #
  # ONE-TIME LOGIN (required before the first `up`): the Telethon USER session
  # must be created interactively once. It is then saved on the tg_session
  # volume and reused on every restart. Run, in a terminal:
  #     docker compose run --rm -it telegram_trader python live_trader.py
  # enter the phone number + login code when prompted; once you see
  # "Listening to NeymarGoldTrader ..." press Ctrl-C, then start it for real:
  #     docker compose up -d telegram_trader
  #
  # SAFETY: DRY_RUN inherits from .env (currently false => LIVE, real orders).
  #         Uncomment DRY_RUN: "true" below to smoke-test (logs orders, places NONE).
  # ───────────────────────────────────────────────────────────────────────────
  telegram_trader:
    build: ./Telegram_Bot
    restart: always
    env_file: .env
    environment:
      TIGERDATA_URL:  ${TIGERDATA_URL:-}
      TG_CHANNEL:     NeymarGoldTrader
      TG_SESSION_DIR: /app/session
      # DRY_RUN: "true"   # uncomment to smoke-test without placing real orders
    volumes:
      - tg_session:/app/session

  # ───────────────────────────────────────────────────────────────────────────
  # Telegram copy-trader — SECOND account. Same @NeymarGoldTrader channel, same
  # code/image, but mirrored onto a *different* MetaAPI account (account2.txt).
  # It runs fully ALONGSIDE the primary telegram_trader above; the two never
  # collide because every shared surface is namespaced:
  #   - MetaAPI account/token .... overridden here (TG2_* — set in .env on the box)
  #   - Telethon session ......... own volume tg_session_neymar2 (separate one-time login)
  #   - tg_* audit tables ........ TG_DB_PREFIX=tg_neymar2  -> tg_neymar2_signals/...
  #   - Redis state keys ......... TG_REDIS_PREFIX=hft:tg2  (only matters with real Redis)
  #   - Kronos dashboard rows .... APIS_DASHBOARD_SYNC=false (no apis_position collision)
  #
  # ONE-TIME LOGIN before the first `up` (its own session volume, so separate
  # from the primary trader's login):
  #     docker compose run --rm -it telegram_trader_neymar2 python live_trader.py
  # enter phone + code; once you see "Listening to NeymarGoldTrader ...", Ctrl-C,
  # then:  docker compose up -d telegram_trader_neymar2
  #
  # REQUIRED in .env on the box (NOT committed — pull from account2.txt):
  #     TG2_META_ACCOUNT_ID=c9bf3b9d-b773-4c93-b387-af79f7a83f66
  #     TG2_META_API_TOKEN=<token from account2.txt>
  # SAFETY: DRY_RUN is "false" => LIVE real orders on the second account.
  #         Consider setting RISK_USD per-account if the two balances differ.
  # ───────────────────────────────────────────────────────────────────────────
  telegram_trader_neymar2:
    build: ./Telegram_Bot
    restart: always
    env_file: .env
    environment:
      META_ACCOUNT_ID:     ${TG2_META_ACCOUNT_ID}
      META_API_TOKEN:      ${TG2_META_API_TOKEN}
      TIGERDATA_URL:       ${TIGERDATA_URL:-}
      TG_CHANNEL:          NeymarGoldTrader
      TG_SESSION_DIR:      /app/session
      TG_DB_PREFIX:        tg_neymar2
      TG_REDIS_PREFIX:     hft:tg2
      APIS_DASHBOARD_SYNC: "false"
      DRY_RUN:             "false"
    volumes:
      - tg_session_neymar2:/app/session

volumes:
  tg_session:
  tg_session_neymar2:
