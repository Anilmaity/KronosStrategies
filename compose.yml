name: kronos

# ─────────────────────────────────────────────────────────────────────────────
# Shared env block — keeps repeated keys DRY.
# Services override or add to these via env_file / environment:.
# ─────────────────────────────────────────────────────────────────────────────
x-common-env: &common-env
  env_file:
    - .env

services:

  # ───────────────────────────────────────────────────────────────────────────
  # Infrastructure
  # Note: both the TimescaleDB tick store (TIGERDATA_URL) and the Django
  # backend database (HOST/PORT/NAME/USER/PASSWORD) live on TigerData Cloud.
  # The local `tsdb` and `db` containers were retired once data was migrated;
  # the stack now points exclusively at TigerData.
  # ───────────────────────────────────────────────────────────────────────────
  # ───────────────────────────────────────────────────────────────────────────
  # Tick Data Collector — polls OANDA S5 candles → writes to TimescaleDB
  # ───────────────────────────────────────────────────────────────────────────
  tick_data_collector:
    build: ./tick_data_collector
    restart: always
    env_file: .env
    environment:
      TSDB_TARGET:      ${TSDB_TARGET:-tigerdata}
      TIGERDATA_URL:    ${TIGERDATA_URL:-}
      OANDA_INSTRUMENT: XAU_USD

  # Same image, second instance polling XAG_USD (silver). Writes to the same
  # ltp hypertable, distinguished by the `symbol` column.
  tick_data_collector_xagusd:
    build: ./tick_data_collector
    restart: always
    env_file: .env
    environment:
      TSDB_TARGET:      ${TSDB_TARGET:-tigerdata}
      TIGERDATA_URL:    ${TIGERDATA_URL:-}
      OANDA_INSTRUMENT: XAG_USD

  # Same image, third instance polling BTC_USD (bitcoin). OANDA serves BTC_USD
  # as a forex-hours CFD on the same practice account, so the shared
  # is_market_closed_utc() gate applies unchanged. Writes to the same ltp
  # hypertable, distinguished by the `symbol` column. Deep history is loaded
  # separately via tick_data_collector/backfill_ltp.py.
  tick_data_collector_btcusd:
    build: ./tick_data_collector
    restart: always
    env_file: .env
    environment:
      TSDB_TARGET:      ${TSDB_TARGET:-tigerdata}
      TIGERDATA_URL:    ${TIGERDATA_URL:-}
      OANDA_INSTRUMENT: BTC_USD

  # ───────────────────────────────────────────────────────────────────────────
  # Position manager — evaluates open positions every second, closes on TP/SL
  # ───────────────────────────────────────────────────────────────────────────
  position_manager:
    build: ./position_manager
    restart: always
    env_file: .env
    environment:
      TSDB_TARGET:   ${TSDB_TARGET:-tigerdata}
      TIGERDATA_URL: ${TIGERDATA_URL:-}

  # ───────────────────────────────────────────────────────────────────────────
  # Strategy services REMOVED 2026-06-24 (operator decision). The four heavy
  # live strategies — kronos_combined_v2, research_m90_bias, research_ob_mit_bias
  # and concept_c03_fvg_fill — were decommissioned and their DB rows deleted via
  # strategies/db/delete_heavy_strategies.py. Recreatable from git history +
  # deploy_combined_v2.py if ever needed again.
  # ───────────────────────────────────────────────────────────────────────────

  # ───────────────────────────────────────────────────────────────────────────
  # CHALLENGE_XAU — H4 Donchian trend-follow with a chandelier TRAILING stop.
  # The deployable answer to the $5000->$5500 FundingPips challenge research
  # (port of bot/challenge_xau.py). Requires its DB rows first:
  #     python -m db.deploy_challenge_xau --commit    (from strategies/)
  # WORKING TF is H4: the runner must pull enough 15m history to form
  #   >= EMA_SLOW(50)+Donchian(20) closed H4 bars, so WIN/DAYS_15M are enlarged
  #   well past the defaults (otherwise get_signal stays silent).
  # The exit is monitor-side trailing -> position_manager MUST be running.
  # SAFETY: set DRY_RUN "true" to smoke-test (logs signals, places NO orders).
  # ───────────────────────────────────────────────────────────────────────────
  challenge_xau:
    build: ./strategies
    restart: always
    command: python research_runner.py
    env_file: .env
    environment:
      TSDB_TARGET: ${TSDB_TARGET:-tigerdata}
      TIGERDATA_URL: ${TIGERDATA_URL:-}
      RESEARCH_STRATEGY: kronos_challenge_xau
      RISK_PER_TRADE_USD: "75"  # Phase-1 risk-normalized sizing (lot = 75USD / SL pts / 100)
      RESEARCH_WIN_15M: "1400"     # ~87 H4 bars of reach (>= 72 needed)
      RESEARCH_DAYS_15M: "28"      # cover ~3-4 trading weeks incl. weekend gaps
      # DRY_RUN: "true"            # uncomment to smoke-test without placing orders

  # ───────────────────────────────────────────────────────────────────────────
  # Strategy Manager — regime-aware meta-controller (60s loop). Computes the
  # market regime (D1/H4 bias, vol & trend regime, session), persists
  # RegimeSnapshot rows, and — when ManagerConfig.master_mode=ON — gates the
  # ARMED child strategies by flipping UserStrategy.is_active per policy.
  # Ships with master_mode=OFF (auto-created row) AND DRY_RUN=true: fully
  # observable, flips nothing. Remove DRY_RUN only after on-box verification.
  # ───────────────────────────────────────────────────────────────────────────
  strategy_manager:
    build: ./strategy_manager
    restart: always
    env_file: .env
    environment:
      TSDB_TARGET:      ${TSDB_TARGET:-tigerdata}
      TIGERDATA_URL:    ${TIGERDATA_URL:-}
      SYMBOL:           XAU_USD
      MANAGER_LOOP_SEC: "60"
      DRY_RUN:          "true"     # safe first deploy: log intended flips only

  # ───────────────────────────────────────────────────────────────────────────
  # Strategy Manager v1 child strategies (design spec 2026-07-02 §4).
  # Each is a research_runner service over backtest_strategies/s9N_*.py.
  # DB rows first:  python -m db.deploy_manager --commit   (from strategies/)
  # BOTH ship with DRY_RUN=true (PAPER): full pipeline — DB rows, audit —
  # but NO broker orders. Additionally their UserStrategy rows are seeded
  # is_active=False, so nothing fires until the user arms them in the manager
  # tab AND DRY_RUN is lifted after a positive held-out backtest.
  # The scalper slot is empty: S97 was retired 2026-07-03 and its intended
  # replacement S98 failed train validation (spec 2026-07-03) — no service.
  # ───────────────────────────────────────────────────────────────────────────

  # S95 — session ORB, delegate of kronos_session_breakout (rewritten 2026-07-06:
  # 30-min OR, sessions [1,7,12,13,14], SL 2.0xOR / TP 0.8xOR). The EMA240+48
  # bias needs >= 290 CLOSED M5 bars, so WIN/DAYS_5M are pinned well past the
  # 80-bar runner default (otherwise get_signal stays silent — classic gotcha).
  s95_session_breakout:
    build: ./strategies
    restart: always
    command: python research_runner.py
    env_file: .env
    environment:
      TSDB_TARGET: ${TSDB_TARGET:-tigerdata}
      TIGERDATA_URL: ${TIGERDATA_URL:-}
      RESEARCH_STRATEGY: s95_session_breakout
      RISK_PER_TRADE_USD: "75"  # Phase-1 risk-normalized sizing (lot = 75USD / SL pts / 100)
      RESEARCH_WIN_5M: "320"       # >= 290 needed for the EMA240+48 bias warmup
      RESEARCH_DAYS_5M: "3"        # refill promptly after weekend gaps
      DRY_RUN: "true"              # PAPER until held-out backtest passes

  # S99 — ICT MSS+FVG reversal (M5), the REVERSAL category (2026-07-06).
  # Liquidity sweep -> structure shift -> FVG retrace entry on the 1m touch.
  # Needs >= ~60 closed M5 bars; WIN_5M default 80 suffices but pinned higher.
  s99_mss_fvg:
    build: ./strategies
    restart: always
    command: python research_runner.py
    env_file: .env
    environment:
      TSDB_TARGET: ${TSDB_TARGET:-tigerdata}
      TIGERDATA_URL: ${TIGERDATA_URL:-}
      RESEARCH_STRATEGY: s99_mss_fvg
      RISK_PER_TRADE_USD: "75"  # Phase-1 risk-normalized sizing
      RESEARCH_WIN_5M: "160"
      RESEARCH_DAYS_5M: "2"
      DRY_RUN: "true"              # PAPER until live fills match the backtest

  # S96 retired from the roster 2026-07-06 (operator decision) — service removed.
